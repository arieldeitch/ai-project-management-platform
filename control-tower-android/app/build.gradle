plugins {
    id 'com.android.application'
}

// Firebase Android client config contains app/project identifiers, not a server credential.
// The tracked google-services.json enables autonomous CI builds. Service-account JSON/private
// keys remain external secrets and must never be committed.
def googleServicesFile = file('google-services.json')
def firebaseConfigured = googleServicesFile.exists()
if (firebaseConfigured) {
    apply plugin: 'com.google.gms.google-services'
}

def gitSha = (System.getenv('CT_GIT_SHA') ?: 'local').take(12)

// Apps Script gateway in front of PROJECT_CONTROL_BOARD.
// The public Web App URL is safe to compile into the private-use client.
// The shared gateway token remains secret and is supplied either by CI secret or once on-device.
def defaultGatewayUrl = 'https://script.google.com/macros/s/AKfycby-YyosI2EYgvsaylDI1f82yFdTR7XuDHwRKshM-K9ODWadXWx3193GfiQKjItnrvqO/exec'
def gatewayUrl = (System.getenv('CT_GATEWAY_URL') ?: defaultGatewayUrl).trim()
def gatewayToken = (System.getenv('CT_GATEWAY_TOKEN') ?: '').trim()
// Local UX review only: point the app at a fixture gateway on the host (http://10.0.2.2:PORT) and allow
// cleartext for that build. Never set in CI; the flag stays false and cleartext stays off.
def reviewGatewayUrl = (System.getenv('CT_REVIEW_GATEWAY_URL') ?: '').trim()
def reviewBuild = !reviewGatewayUrl.isEmpty()
if (reviewBuild) gatewayUrl = reviewGatewayUrl
// Quote a value as a Java string literal for BuildConfig (escape backslash and double quote).
def jstr = { String s -> '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"' }

// Persistent release signing. The keystore and its passwords are never in Git: CI decodes the
// CT_RELEASE_KEYSTORE_B64 secret to a temp file and passes the path + passwords through env.
// Locally, point CT_RELEASE_KEYSTORE_PATH at the keystore kept outside the repo.
def releaseKeystorePath = (System.getenv('CT_RELEASE_KEYSTORE_PATH') ?: '').trim()
def releaseSigningAvailable = !releaseKeystorePath.isEmpty() && file(releaseKeystorePath).exists()

android {
    namespace 'com.ariel.controltower'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ariel.controltower'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.9.0'
        buildConfigField 'String', 'GATEWAY_URL', jstr(gatewayUrl)
        buildConfigField 'String', 'GATEWAY_TOKEN', jstr(gatewayToken)
        buildConfigField 'String', 'GIT_SHA', "\"${gitSha}\""
        buildConfigField 'boolean', 'FIREBASE_CONFIGURED', "${firebaseConfigured}"
        buildConfigField 'boolean', 'REVIEW_BUILD', "${reviewBuild}"
        manifestPlaceholders = [cleartext: reviewBuild ? 'true' : 'false']
    }

    signingConfigs {
        if (releaseSigningAvailable) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('CT_RELEASE_KEYSTORE_PASSWORD') ?: ''
                keyAlias System.getenv('CT_RELEASE_KEY_ALIAS') ?: 'controltower'
                keyPassword System.getenv('CT_RELEASE_KEY_PASSWORD') ?: ''
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        // The install-over baseline for Ariel's phone: the same persistent key on every future build.
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            if (releaseSigningAvailable) signingConfig signingConfigs.release
        }
        debug {
            // Unchanged debug path (runner/local debug key) for emulator and review work.
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Pinned Firebase BoM; firebase-messaging version is resolved from the BoM. Push transport only.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    // Unit tests run on the JVM: JUnit 4 plus the real org.json (android.jar only carries stubs).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
