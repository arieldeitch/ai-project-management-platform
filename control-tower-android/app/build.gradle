plugins {
    id 'com.android.application'
}

// Firebase config is an external, per-environment file and is never committed.
// The CI workflow materialises it from the GOOGLE_SERVICES_JSON secret when present.
// Without it the app still builds and runs; push is reported as "not configured" in-app.
def googleServicesFile = file('google-services.json')
def firebaseConfigured = googleServicesFile.exists()
if (firebaseConfigured) {
    apply plugin: 'com.google.gms.google-services'
}

def gitSha = (System.getenv('CT_GIT_SHA') ?: 'local').take(12)

// Apps Script gateway in front of PROJECT_CONTROL_BOARD. Both values come from CI secrets
// (CT_GATEWAY_URL / CT_GATEWAY_TOKEN); they are never committed. When absent the app shows
// its setup screen and accepts them on-device.
def gatewayUrl = (System.getenv('CT_GATEWAY_URL') ?: '').trim()
def gatewayToken = (System.getenv('CT_GATEWAY_TOKEN') ?: '').trim()
// Quote a value as a Java string literal for BuildConfig (escape backslash and double quote).
def jstr = { String s -> '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'com.ariel.controltower'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ariel.controltower'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        buildConfigField 'String', 'GATEWAY_URL', jstr(gatewayUrl)
        buildConfigField 'String', 'GATEWAY_TOKEN', jstr(gatewayToken)
        buildConfigField 'String', 'GIT_SHA', "\"${gitSha}\""
        buildConfigField 'boolean', 'FIREBASE_CONFIGURED', "${firebaseConfigured}"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Pinned Firebase BoM; firebase-messaging version is resolved from the BoM. Push transport only.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
